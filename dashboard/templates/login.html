<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ — LineSmart</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#f0faf0">
<div class="card shadow" style="width:360px">
  <div class="card-body p-4">
    <h4 class="text-center mb-1" style="color:#06c755">LineSmart</h4>
    <p class="text-center text-muted mb-4">ระบบจัดการร้านค้า</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="alert alert-danger">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">รหัสผ่าน</label>
        <input type="password" name="password" class="form-control" autofocus required>
      </div>
      <button class="btn w-100 text-white" style="background:#06c755">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>
</body>
</html>
