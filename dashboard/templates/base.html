<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LineSmart Admin{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background:#f8f9fa; font-family: 'Sarabun', sans-serif; }
  .sidebar { min-height:100vh; background:#06c755; }
  .sidebar a { color:rgba(255,255,255,.85); text-decoration:none; display:block; padding:10px 20px; }
  .sidebar a:hover, .sidebar a.active { background:rgba(0,0,0,.15); color:#fff; }
  .sidebar .brand { font-size:1.3rem; font-weight:700; padding:20px; color:#fff; border-bottom:1px solid rgba(255,255,255,.2); }
  .badge-pending { background:#ff6b35; }
</style>
</head>
<body>
<div class="d-flex">
  <div class="sidebar" style="width:220px;min-width:220px">
    <div class="brand">LineSmart</div>
    <a href="/admin/" class="{% if request.path=='/admin/' %}active{% endif %}">หน้าหลัก</a>
    <a href="/admin/orders" class="{% if 'orders' in request.path %}active{% endif %}">ออเดอร์</a>
    <a href="/admin/products" class="{% if 'products' in request.path %}active{% endif %}">สินค้า</a>
    <a href="/admin/settings" class="{% if 'settings' in request.path %}active{% endif %}">ตั้งค่าร้าน</a>
    <a href="/admin/logout" style="position:absolute;bottom:0;width:220px">ออกจากระบบ</a>
  </div>
  <div class="flex-grow-1 p-4">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-success alert-dismissible fade show">{{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
